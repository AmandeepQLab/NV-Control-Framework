[pytest]
# Restrict collection to tests/ so a bare `pytest` from the repo root never
# recurses into sequencing/test_sequence.py (a demo script, not a real test,
# that prints on import) or anywhere else outside the test suite.
testpaths = tests

markers =
    hardware: exercises real lab hardware (Andor camera, SG386, Swabian pulse streamer, Helmholtz power supplies). Excluded from collection by tests/conftest.py unless --hardware is passed.
